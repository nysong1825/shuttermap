<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>셔터맵</title>
  <meta name="description" content="휴그 카메라 작례 지도 — 지도에서 작례를 보고 내 사진도 그 느낌으로">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <h1>셔터맵</h1>
    <p class="subtitle">휴그 카메라 작례 지도</p>
  </header>

  <main>
    <section id="screen-map" class="screen">
      <div id="map" aria-label="작례 지도"></div>
      <div id="chips" class="chips" role="group" aria-label="카메라 모델"></div>

      <div id="sheet-backdrop" class="sheet-backdrop" hidden></div>
      <div id="sheet" class="sheet" role="dialog" aria-label="작례 사진" hidden>
        <button type="button" class="sheet-close" aria-label="닫기">×</button>
        <img class="sheet-photo" alt="">
        <div class="sheet-body">
          <p class="sheet-meta"><span class="sheet-model"></span> · <span class="sheet-place"></span></p>
          <p class="sheet-caption"></p>
          <div class="sheet-actions">
            <button type="button" class="btn btn-primary sheet-try">내 사진도 이 느낌으로</button>
            <a class="btn btn-secondary sheet-product" target="_blank" rel="noopener">제품 보기</a>
          </div>
        </div>
      </div>
    </section>

    <section id="screen-convert" class="screen" hidden>
    </section>
  </main>

  <nav class="tabbar" aria-label="화면 전환">
    <button type="button" data-screen="map" aria-current="page">지도</button>
    <button type="button" data-screen="convert">내 사진 변환</button>
  </nav>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
