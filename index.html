<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>셔터맵</title>
  <meta name="description" content="휴그 카메라 작례 지도 — 지도에서 작례를 보고 내 사진도 그 느낌으로">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <h1>셔터맵</h1>
    <p class="subtitle">휴그 카메라 작례 지도</p>
  </header>

  <main>
    <section id="screen-map" class="screen">
      <div id="map" aria-label="작례 지도"></div>
      <div id="chips" class="chips" role="group" aria-label="카메라 모델"></div>

      <div id="sheet-backdrop" class="sheet-backdrop" hidden></div>
      <div id="sheet" class="sheet" role="dialog" aria-label="작례 사진" hidden>
        <button type="button" class="sheet-close" aria-label="닫기">×</button>
        <img class="sheet-photo" alt="">
        <div class="sheet-body">
          <p class="sheet-meta"><span class="sheet-model"></span> · <span class="sheet-place"></span></p>
          <p class="sheet-caption"></p>
          <div class="sheet-actions">
            <button type="button" class="btn btn-primary sheet-try">내 사진도 이 느낌으로</button>
            <a class="btn btn-secondary sheet-product" target="_blank" rel="noopener">제품 보기</a>
          </div>
        </div>
      </div>
    </section>

    <section id="screen-convert" class="screen" hidden>
      <div class="convert">
        <h2>내 사진도 휴그 카메라 느낌으로</h2>
        <p class="convert-lead">사진은 서버로 전송되지 않고 이 화면 안에서만 바뀌어요.</p>

        <label class="btn btn-primary convert-pick">
          사진 고르기
          <input class="convert-input" type="file" accept="image/jpeg,image/png" hidden>
        </label>
        <p class="convert-error" role="alert" hidden>JPG/PNG 사진을 올려주세요.</p>

        <div class="convert-chips chips-inline" role="group" aria-label="카메라 모델"></div>

        <div class="convert-empty">
          <p>사진을 고르면 모델별 느낌을 바로 비교할 수 있어요.</p>
        </div>

        <div class="convert-result" hidden>
          <div class="compare" style="--pos: 50%">
            <span class="compare-label compare-label-left">원본</span>
            <span class="compare-label compare-label-right">필터</span>
          </div>
          <input class="compare-slider" type="range" min="0" max="100" value="50" aria-label="원본과 필터 비교">
          <div class="convert-actions">
            <button type="button" class="btn btn-primary convert-save">저장하기</button>
            <a class="btn btn-secondary convert-product" target="_blank" rel="noopener"></a>
          </div>
        </div>

        <p class="convert-notice">필터 체험이며 실제 촬영 결과와 다를 수 있음</p>
      </div>

      <div class="save-overlay" role="dialog" aria-label="이미지 저장" hidden>
        <p>이미지를 길게 눌러 저장하세요</p>
        <img alt="변환된 사진">
        <button type="button" class="btn btn-secondary save-overlay-close">닫기</button>
      </div>
    </section>
  </main>

  <div id="intro" class="intro" role="dialog" aria-label="셔터맵 소개" hidden>
    <div class="intro-card">
      <h2>셔터맵</h2>
      <p class="intro-lead">지도에서 휴그 카메라로 찍은 작례를 보고,<br>내 사진도 그 느낌으로 바꿔보세요.</p>
      <ul>
        <li>사진은 서버로 전송되지 않고 내 폰 안에서만 바뀌어요.</li>
        <li>필터 체험이며 실제 촬영 결과와 다를 수 있음</li>
      </ul>
      <button type="button" class="btn btn-primary intro-start">시작하기</button>
    </div>
  </div>

  <nav class="tabbar" aria-label="화면 전환">
    <button type="button" data-screen="map" aria-current="page">지도</button>
    <button type="button" data-screen="convert">내 사진 변환</button>
  </nav>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
